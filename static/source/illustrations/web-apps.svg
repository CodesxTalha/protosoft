 class="fl-mid" x="198" y="202.5" width="30" height="3" rx="1.5"/><rect class="fl-soft" x="198" y="207.5" width="20" height="2.5" rx="1.25"/><line class="ln" x1="184" y1="216" x2="232" y2="216" stroke="#f0f0ee"/></g><g><circle class="fl-mid" cx="190" cy="226" r="4"/><rect class="fl-mid" x="198" y="222.5" width="18" height="3" rx="1.5"/><rect class="fl-soft" x="198" y="227.5" width="12" height="2.5" rx="1.25"/><line class="ln" x1="184" y1="236" x2="232" y2="236" stroke="#f0f0ee"/></g><g><circle class="fl-mid" cx="190" cy="246" r="4"/><rect class="fl-mid" x="198" y="242.5" width="28" height="3" rx="1.5"/><rect class="fl-soft" x="198" y="247.5" width="18" height="2.5" rx="1.25"/><line class="ln" x1="184" y1="256" x2="232" y2="256" stroke="#f0f0ee"/></g></g></g>
