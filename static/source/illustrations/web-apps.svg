<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="web-apps">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ink { stroke: #141414; }
.soft { stroke: #e0e0de; }
.mid { stroke: #b4b4b2; }
.w { fill: #fff; }
.bg { fill: #fafafa; }
.f1 { fill: #1f1f1f; }
.f2 { fill: #ececea; }
.f3 { fill: #d6d6d4; }
.lbl { font-size: 6.2px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.t5 { font-size: 5px; font-weight: 500; fill: #141414; }
.t6 { font-size: 6px; font-weight: 600; fill: #141414; }
.mu { fill: #8a8a88; font-weight: 400; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.a-spark { stroke-dasharray: 100; animation: a-draw 8s ease-in-out infinite; }
.a-dot   { animation: a-dot 8s ease-in-out infinite; }
.a-area  { animation: a-area 8s ease-in-out infinite; }
.a-list  { animation: a-scroll 8s cubic-bezier(.5, 0, .15, 1) infinite; }
@keyframes a-draw {
  0%       { stroke-dashoffset: 100; opacity: 1; }
  40%, 84% { stroke-dashoffset: 0; opacity: 1; }
  94%      { stroke-dashoffset: 0; opacity: 0; }
  100%     { stroke-dashoffset: 100; opacity: 0; }
}
@keyframes a-dot {
  0%, 38%  { opacity: 0; }
  44%, 84% { opacity: 1; }
  94%, 100% { opacity: 0; }
}
@keyframes a-area {
  0%, 38%  { opacity: 0; }
  42%, 90% { opacity: 1; }
  94%, 100% { opacity: 0; }
}
@keyframes a-scroll {
  0%, 16%   { transform: translateY(0); }
  20%, 36%  { transform: translateY(-18px); }
  40%, 56%  { transform: translateY(-36px); }
  60%, 76%  { transform: translateY(-54px); }
  80%, 96%  { transform: translateY(-72px); }
  100%      { transform: translateY(-90px); }
}

]]></style>
