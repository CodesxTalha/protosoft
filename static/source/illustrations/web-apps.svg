  <rect class="ln ln-soft fl-w" x="66.5" y="84.5" width="98" height="46" rx="4"/>
  <line class="ln" x1="67" y1="100.5" x2="164" y2="100.5" stroke="#e6e6e4" stroke-dasharray="2 3"/>
  <line class="ln" x1="67" y1="115.5" x2="164" y2="115.5" stroke="#e6e6e4" stroke-dasharray="2 3"/>
  <g clip-path="url(#a-plot)"><g clip-path="url(#a-rev)">
    <path class="a-area" fill="url(#a-fill)" d="M72,124 L84,117 L96,120 L108,108 L120,111 L132,99 L144,102 L157,92 L157 130 L72 130 Z"/>
  </g></g>
  <polyline class="ln ln-ink a-spark" pathLength="100" stroke-linejoin="round" stroke-linecap="round" points="72,124 84,117 96,120 108,108 120,111 132,99 144,102 157,92"/>
  <g class="a-dot">
    <line class="ln" x1="157" y1="92" x2="157" y2="130" stroke="#d6d6d4" stroke-dasharray="2 2"/>
    <circle cx="157" cy="92" r="5.6" fill="#141414" opacity=".1"/>
