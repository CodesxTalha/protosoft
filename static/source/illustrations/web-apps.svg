<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="web-apps">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ln-ink  { stroke: #141414; }
.ln-mid  { stroke: #b4b4b2; }
.ln-soft { stroke: #dcdcda; }
.fl-w    { fill: #fff; }
.fl-soft { fill: #ececea; }
.fl-mid  { fill: #d6d6d4; }
.fl-ink  { fill: #1f1f1f; }
.lbl { font-size: 7px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.txt { font-size: 8.5px; font-weight: 500; fill: #141414; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.a-spark { stroke-dasharray: 100; animation: a-draw 6s ease-in-out infinite; }
.a-dot   { animation: a-dot 6s ease-in-out infinite; }
.a-area  { animation: a-area 6s ease-in-out infinite; }
.a-reveal { transform-box: fill-box; transform-origin: left center; animation: a-reveal 6s ease-in-out infinite; }
.a-list  { animation: a-scroll 6s cubic-bezier(.6, 0, .2, 1) infinite; }
@keyframes a-draw {
  0%       { stroke-dashoffset: 100; opacity: 1; }
  45%, 84% { stroke-dashoffset: 0; opacity: 1; }
  94%      { stroke-dashoffset: 0; opacity: 0; }
  100%     { stroke-dashoffset: 100; opacity: 0; }
}
@keyframes a-dot {
  0%, 42%  { opacity: 0; }
  48%, 84% { opacity: 1; }
  94%, 100% { opacity: 0; }
}
@keyframes a-area {
  0%, 84%  { opacity: 1; }
  94%, 100% { opacity: 0; }
}
@keyframes a-reveal {
  0%       { transform: scaleX(0); }
  45%, 100% { transform: scaleX(1); }
}
@keyframes a-scroll {
  0%, 14%   { transform: translateY(0); }
  20%, 34%  { transform: translateY(-20px); }
  40%, 54%  { transform: translateY(-40px); }
  60%, 74%  { transform: translateY(-60px); }
  80%, 94%  { transform: translateY(-80px); }
  100%      { transform: translateY(-100px); }
}

]]></style>
<defs>
  <symbol id="i-heart" class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-heart-solid" class="ic" viewBox="0 0 24 24"><path class="solid" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-comment" class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-send" class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-bookmark" class="ic" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-up" class="ic" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="280" height="160" fill="#fafafa"/>

<g transform="translate(11 0)">
  <defs>
