<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="design">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ink { stroke: #141414; }
.soft { stroke: #e0e0de; }
.mid { stroke: #b4b4b2; }
.w { fill: #fff; }
.bg { fill: #fafafa; }
.f1 { fill: #1f1f1f; }
.f2 { fill: #ececea; }
.f3 { fill: #d6d6d4; }
.lbl { font-size: 6.2px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.t5 { font-size: 5px; font-weight: 500; fill: #141414; }
.t6 { font-size: 6px; font-weight: 600; fill: #141414; }
.mu { fill: #8a8a88; font-weight: 400; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.d-cursor { transform: translate(243px, 55px); opacity: 0; animation: d-cursor 7s cubic-bezier(.45, 0, .25, 1) infinite; }
.d-click  { transform-box: fill-box; transform-origin: 0 0; animation: d-click 7s ease infinite; }
.d-sel    { animation: d-sel 7s ease infinite; }
.d-btn    { animation: d-btn 7s ease infinite; }
.d-btxt   { animation: d-btxt 7s ease infinite; }
.d-ring   { transform-box: fill-box; transform-origin: center; animation: d-ring 7s ease infinite; }
.d-hex    { animation: d-sel 7s ease infinite; }
.fname { font-size: 6.2px; font-weight: 500; fill: #8a8a88; }
@keyframes d-cursor {
  0%, 6%    { transform: translate(262px, 150px); opacity: 0; }
  10%       { opacity: 1; }
  28%, 36%  { transform: translate(113px, 91px); }
  54%, 64%  { transform: translate(243px, 56px); opacity: 1; }
  80%, 100% { transform: translate(292px, 56px); opacity: 0; }
}
@keyframes d-click {
  0%, 30%   { transform: scale(1); }
  32%       { transform: scale(.82); }
  34%, 57%  { transform: scale(1); }
  59%       { transform: scale(.82); }
  61%, 100% { transform: scale(1); }
}
@keyframes d-sel {
  0%, 32%   { opacity: 0; }
  35%, 86%  { opacity: 1; }
  90%, 100% { opacity: 0; }
}
@keyframes d-btn {
  0%, 59%   { fill: #d2d2d0; }
  63%, 88%  { fill: #1f1f1f; }
  94%, 100% { fill: #d2d2d0; }
}
@keyframes d-btxt {
  0%, 59%   { fill: #141414; }
  63%, 88%  { fill: #fafafa; }
  94%, 100% { fill: #141414; }
}
@keyframes d-ring {
  0%, 58%   { opacity: 0; transform: scale(.75); }
  62%, 88%  { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(1); }
}

]]></style>
<defs>
  <symbol id="i-heart" class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-heart-solid" class="ic" viewBox="0 0 24 24"><path class="solid" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-comment" class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-send" class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-bookmark" class="ic" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-up" class="ic" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="280" height="160" class="bg"/>

<!-- Type specimen -->
<line class="ln soft" x1="12" y1="62.5" x2="62" y2="62.5" stroke-dasharray="2 2"/>
<line class="ln soft" x1="12" y1="81.5" x2="62" y2="81.5" stroke-dasharray="2 2"/>
<text x="15" y="81" font-size="27" font-weight="500" letter-spacing="-0.7" fill="#141414">Aa</text>
<text class="t5" x="14" y="96.5" style="font-size:6.2px">Inter Tight</text>
<text class="t5 mu" x="14" y="104.5" style="font-size:5.4px">Medium · 500</text>

<!-- Frame -->
<text class="fname" x="76" y="17.6">Home · 1440 × 900</text>
<defs><clipPath id="d-img"><rect x="86" y="99" width="109" height="28" rx="3"/></clipPath></defs>
<rect class="ln ink w" x="76.5" y="22.5" width="128" height="112" rx="3"/>

<!-- site nav -->
<circle class="f1" cx="87" cy="31" r="2.6"/>
<text x="92.5" y="33" font-size="6.4" font-weight="600" letter-spacing="-.1" fill="#141414">Koa</text>
<text class="t5 mu" x="150" y="32.6" style="font-size:4.9px">Menu</text>
<text class="t5 mu" x="164" y="32.6" style="font-size:4.9px">Shop</text>
<text class="t5 mu" x="177" y="32.6" style="font-size:4.9px">About</text>
<line class="ln soft" x1="77" y1="39.5" x2="204" y2="39.5"/>

<!-- hero copy -->
<text x="86" y="55" font-size="9" font-weight="600" letter-spacing="-.35" fill="#141414">Good coffee,</text>
<text x="86" y="65.4" font-size="9" font-weight="600" letter-spacing="-.35" fill="#141414">made simple.</text>
<text class="t5 mu" x="86" y="74.4" style="font-size:4.7px">Small-batch roasts, delivered weekly.</text>
<rect class="d-btn" x="86" y="80" width="40" height="13" rx="3.5"/>
<text class="d-btxt" x="106" y="88.4" text-anchor="middle" font-size="5.2" font-weight="500">Order now</text>
<text class="t5 mu" x="133" y="88.4" style="font-size:5px">See menu →</text>

<!-- hero image: layered hills + sun -->
<g clip-path="url(#d-img)">
  <rect x="86" y="99" width="109" height="28" fill="#ececea"/>
  <circle cx="177" cy="108" r="5" fill="#fafafa"/>
  <path fill="#d6d6d4" d="M86 127 V117 C98 108 108 108 118 114 C126 118.5 134 119 142 114 C152 107 164 107 195 118 V127 Z"/>
  <path fill="#bfbfbd" d="M86 127 V121 C100 116 112 118 124 121 C140 125.5 156 118.5 168 117 C178 116 187 118 195 121 V127 Z"/>
</g>

<!-- selection on the button -->
<g class="d-sel">
  <rect class="ln ink" x="85.5" y="79.5" width="41" height="14"/>
  <rect class="ln ink w" x="83.5" y="77.5" width="4" height="4"/>
  <rect class="ln ink w" x="124.5" y="77.5" width="4" height="4"/>
  <rect class="ln ink w" x="83.5" y="91.5" width="4" height="4"/>
  <rect class="ln ink w" x="124.5" y="91.5" width="4" height="4"/>
  <rect class="f1" x="89.5" y="98" width="33" height="10" rx="2.5"/>
  <text x="106" y="104.9" text-anchor="middle" font-size="5.3" font-weight="500" class="inv">120 × 40</text>
</g>

<!-- swatches -->
<circle class="f1" cx="240" cy="50" r="8"/>
<circle fill="#8f8f8d" cx="240" cy="72" r="8"/>
<circle class="ln soft w" cx="240" cy="94" r="7.5" style="stroke:#c4c4c2"/>
<circle class="ln ink d-ring" cx="240" cy="50" r="11.5"/>
<text class="lbl" x="240" y="124" text-anchor="middle">Color</text>
<text class="d-hex" x="240" y="133" text-anchor="middle" font-size="5.6" font-weight="500" fill="#141414">#1F1F1F</text>

<!-- cursor -->
<g class="d-cursor"><g class="d-click">
  <path class="f1" stroke="#fafafa" stroke-width=".8" stroke-linejoin="round" d="M0 0 L0 13 L3.6 9.9 L6.1 15.2 L8.3 14.2 L5.9 9.1 L10.4 9 Z"/>
</g></g>


</svg>
