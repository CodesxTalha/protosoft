<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="design">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ln-ink  { stroke: #141414; }
.ln-mid  { stroke: #b4b4b2; }
.ln-soft { stroke: #dcdcda; }
.fl-w    { fill: #fff; }
.fl-soft { fill: #ececea; }
.fl-mid  { fill: #d6d6d4; }
.fl-ink  { fill: #1f1f1f; }
.lbl { font-size: 7px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.txt { font-size: 8.5px; font-weight: 500; fill: #141414; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.d-cursor { transform: translate(239px, 57px); opacity: 0; animation: d-cursor 7s cubic-bezier(.45, 0, .25, 1) infinite; }
.d-click  { transform-box: fill-box; transform-origin: 0 0; animation: d-click 7s ease infinite; }
.d-sel    { animation: d-sel 7s ease infinite; }
.d-btn    { fill: #1f1f1f; animation: d-btn 7s ease infinite; }
.d-ring   { transform-box: fill-box; transform-origin: center; animation: d-ring 7s ease infinite; }
@keyframes d-cursor {
  0%, 6%    { transform: translate(262px, 150px); opacity: 0; }
  10%       { opacity: 1; }
  28%, 36%  { transform: translate(126px, 119px); }
  54%, 64%  { transform: translate(239px, 57px); opacity: 1; }
  80%, 100% { transform: translate(292px, 57px); opacity: 0; }
}
@keyframes d-click {
  0%, 30%   { transform: scale(1); }
  32%       { transform: scale(.82); }
  34%, 57%  { transform: scale(1); }
  59%       { transform: scale(.82); }
  61%, 100% { transform: scale(1); }
}
@keyframes d-sel {
  0%, 32%   { opacity: 0; }
  35%, 86%  { opacity: 1; }
  90%, 100% { opacity: 0; }
}
@keyframes d-btn {
  0%, 59%   { fill: #cfcfcd; }
  63%, 88%  { fill: #1f1f1f; }
  94%, 100% { fill: #cfcfcd; }
}
@keyframes d-ring {
  0%, 58%   { opacity: 0; transform: scale(.75); }
  62%, 88%  { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(1); }
}

]]></style>
<defs>
  <symbol id="i-heart" class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-heart-solid" class="ic" viewBox="0 0 24 24"><path class="solid" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-comment" class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-send" class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-bookmark" class="ic" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-up" class="ic" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="280" height="160" fill="#fafafa"/>

<g transform="translate(6 0)">
  <defs><clipPath id="d-img"><rect x="86" y="56" width="108" height="40" rx="4"/></clipPath></defs>

  <!-- Type specimen -->
  <line class="ln ln-soft" x1="16" y1="68.5" x2="58" y2="68.5" stroke-dasharray="2 2"/>
  <line class="ln ln-soft" x1="16" y1="88.5" x2="58" y2="88.5" stroke-dasharray="2 2"/>
  <text x="20" y="88" font-size="26" font-weight="500" letter-spacing="-0.6" fill="#141414">Aa</text>
  <text class="lbl" x="20" y="104">Type</text>

  <!-- Artboard -->
  <text class="lbl" x="76" y="16">Frame · 1440</text>
  <rect class="ln ln-ink fl-w" x="76.5" y="22.5" width="128" height="112" rx="6"/>
  <circle class="fl-mid" cx="92" cy="40" r="6"/>
  <rect class="fl-mid" x="104" y="35" width="52" height="4" rx="2"/>
  <rect class="fl-soft" x="104" y="43" width="32" height="3" rx="1.5"/>

  <g clip-path="url(#d-img)">
    <rect x="86" y="56" width="108" height="40" fill="#ececea"/>
    <circle cx="176" cy="68" r="5.5" fill="#fff"/>
    <path fill="#dcdcda" d="M86 96V84C98 72 108 72 118 79C126 84 134 85 142 79C152 71 164 72 194 84V96Z"/>
    <path fill="#cbcbc9" d="M86 96V88C100 82 112 85 124 88C140 92 156 85 168 83C178 82 187 85 194 88V96Z"/>
  </g>

  <rect class="d-btn" x="86" y="108" width="46" height="14" rx="4"/>
  <rect fill="#fafafa" x="97" y="114" width="24" height="2" rx="1"/>
  <rect class="fl-mid" x="140" y="113.5" width="32" height="3" rx="1.5"/>

  <!-- Selection on the button -->
  <g class="d-sel">
    <rect class="ln ln-ink" x="83.5" y="105.5" width="52" height="20"/>
    <rect class="ln ln-ink fl-w" x="81.5" y="103.5" width="4" height="4"/>
    <rect class="ln ln-ink fl-w" x="133.5" y="103.5" width="4" height="4"/>
    <rect class="ln ln-ink fl-w" x="81.5" y="123.5" width="4" height="4"/>
    <rect class="ln ln-ink fl-w" x="133.5" y="123.5" width="4" height="4"/>
    <rect class="fl-ink" x="92" y="131" width="35" height="11" rx="2.5"/>
    <text x="109.5" y="138.8" font-size="7" font-weight="500" class="inv" text-anchor="middle">46 × 14</text>
  </g>

  <!-- Swatches -->
  <circle class="fl-ink" cx="240" cy="56" r="8"/>
  <circle fill="#8f8f8d" cx="240" cy="78" r="8"/>
  <circle class="ln fl-w" cx="240" cy="100" r="7.5" stroke="#c4c4c2"/>
  <circle class="ln ln-ink d-ring" cx="240" cy="56" r="11.5"/>
  <text class="lbl" x="240" y="128" text-anchor="middle">Color</text>

  <!-- Cursor -->
  <g class="d-cursor"><g class="d-click">
    <path class="fl-ink" stroke="#fafafa" stroke-width=".8" stroke-linejoin="round" d="M0 0 L0 13 L3.6 9.9 L6.1 15.2 L8.3 14.2 L5.9 9.1 L10.4 9 Z"/>
  </g></g>
</g>


</svg>
