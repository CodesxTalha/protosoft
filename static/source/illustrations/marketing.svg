<script><![CDATA[
/* Likes count up fast right after the heart pops, then match the heart chip (1,284). */
(function () {
  var likes = document.querySelector('.s-likes'), heart = document.querySelector('.s-heart');
  if (!likes || !heart || !heart.getAnimations) return;
  var TOTAL = 1284, CYCLE = 6000, START = 0.12, END = 0.28, RESET = 0.94;
  function label(n) { return n === 0 ? 'Be the first to like this' : n === 1 ? '1 like' : n.toLocaleString('en-US') + ' likes'; }
  var last = -1;
  (function tick() {
    var a = heart.getAnimations()[0];
    if (a) {
      var t = ((a.currentTime || 0) % CYCLE) / CYCLE, n;
      if (t < START || t >= RESET) n = 0;
      else if (t < END) { var p = (t - START) / (END - START); n = Math.round(TOTAL * (1 - Math.pow(1 - p, 3))); }
      else n = TOTAL;
      if (n !== last) { likes.textContent = label(n); last = n; }
    }
    requestAnimationFrame(tick);
  })();
})();
]]></script>
