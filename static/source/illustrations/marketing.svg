<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="marketing">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ink { stroke: #141414; }
.soft { stroke: #e0e0de; }
.mid { stroke: #b4b4b2; }
.w { fill: #fff; }
.bg { fill: #fafafa; }
.f1 { fill: #1f1f1f; }
.f2 { fill: #ececea; }
.f3 { fill: #d6d6d4; }
.lbl { font-size: 6.2px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.t5 { font-size: 5px; font-weight: 500; fill: #141414; }
.t6 { font-size: 6px; font-weight: 600; fill: #141414; }
.mu { fill: #8a8a88; font-weight: 400; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.s-progress { transform-box: fill-box; transform-origin: left center; transform: scaleX(.62); animation: s-progress 6s linear infinite; }
.s-heart    { transform-box: fill-box; transform-origin: center; animation: s-heart 6s ease infinite; }
.s-chip     { animation: s-chip 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.s-chip-2   { animation-name: s-chip-2; }
.s-chip-3   { animation-name: s-chip-3; }
.s-slot     { transform-box: fill-box; transform-origin: center; animation: s-slot 6s ease infinite; }
.s-slotn    { animation: s-slotn 6s ease infinite; }
.s-likes    { font-variant-numeric: tabular-nums; }
@keyframes s-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes s-heart {
  0%, 12%   { transform: scale(0); }
  17%       { transform: scale(1.25); }
  21%, 88%  { transform: scale(1); }
  94%, 100% { transform: scale(0); }
}
@keyframes s-chip {
  0%, 29%   { opacity: 0; transform: translateX(-6px); }
  35%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes s-chip-2 {
  0%, 39%   { opacity: 0; transform: translateX(-6px); }
  45%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes s-chip-3 {
  0%, 49%   { opacity: 0; transform: translateX(-6px); }
  55%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes s-slot {
  0%, 60%   { fill: #e4e4e2; transform: scale(1); }
  64%       { fill: #1f1f1f; transform: scale(1.2); }
  68%, 88%  { fill: #1f1f1f; transform: scale(1); }
  94%, 100% { fill: #e4e4e2; transform: scale(1); }
}
@keyframes s-slotn {
  0%, 60%   { fill: #141414; }
  64%, 88%  { fill: #fafafa; }
  94%, 100% { fill: #141414; }
}

]]></style>
