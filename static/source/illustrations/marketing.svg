="#8a8a88">11</text><circle class="f1" cx="56.4" cy="79.9" r="4.4"/><text x="56.4" y="81.5" text-anchor="middle" font-size="4.5" font-weight="500" fill="#fafafa">12</text><text x="66.6" y="81.5" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">13</text><text x="76.8" y="81.5" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">14</text><text x="15.6" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">15</text><text x="25.8" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">16</text><circle class="f1" cx="36.0" cy="90.3" r="4.4"/><text x="36.0" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#fafafa">17</text><text x="46.2" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">18</text><circle class="f1" cx="56.4" cy="90.3" r="4.4"/><text x="56.4" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#fafafa">19</text><text x="66.6" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">20</text><text x="76.8" y="91.9" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">21</text><text x="15.6" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">22</text><text x="25.8" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">23</text><circle class="s-slot" cx="36.0" cy="100.7" r="4.4" fill="#e4e4e2"/><text class="s-slotn" x="36.0" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500">24</text><text x="46.2" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">25</text><text x="56.4" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">26</text><text x="66.6" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">27</text><text x="76.8" y="102.3" text-anchor="middle" font-size="4.5" font-weight="500" fill="#8a8a88">28</text>
