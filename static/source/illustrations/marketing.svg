<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="marketing">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ln-ink  { stroke: #141414; }
.ln-mid  { stroke: #b4b4b2; }
.ln-soft { stroke: #dcdcda; }
.fl-w    { fill: #fff; }
.fl-soft { fill: #ececea; }
.fl-mid  { fill: #d6d6d4; }
.fl-ink  { fill: #1f1f1f; }
.lbl { font-size: 7px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.txt { font-size: 8.5px; font-weight: 500; fill: #141414; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.s-track    { animation: s-slide 6s cubic-bezier(.65, 0, .25, 1) infinite; }
.s-dot1     { animation: s-dot1 6s ease infinite; }
.s-dot2     { animation: s-dot2 6s ease infinite; }
.s-n1       { animation: s-n1 6s ease infinite; }
.s-n2       { animation: s-n2 6s ease infinite; }
.s-heart    { transform-box: fill-box; transform-origin: center; animation: s-heart 6s ease infinite; }
.s-chip     { animation: s-chip 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.s-chip-2   { animation-name: s-chip-2; }
.s-chip-3   { animation-name: s-chip-3; }
.s-slot     { transform-box: fill-box; transform-origin: center; animation: s-slot 6s ease infinite; }
.s-likes    { font-variant-numeric: tabular-nums; }
@keyframes s-slide {
  0%, 48%   { transform: translateX(0); }
  56%, 86%  { transform: translateX(-88px); }
  94%, 100% { transform: translateX(0); }
}
@keyframes s-dot1 {
  0%, 48%   { fill: #1f1f1f; }
  56%, 86%  { fill: #cfcfcd; }
  94%, 100% { fill: #1f1f1f; }
}
@keyframes s-dot2 {
  0%, 48%   { fill: #cfcfcd; }
  56%, 86%  { fill: #1f1f1f; }
  94%, 100% { fill: #cfcfcd; }
}
@keyframes s-n1 {
  0%, 50%   { opacity: 1; }
  54%, 88%  { opacity: 0; }
  92%, 100% { opacity: 1; }
}
@keyframes s-n2 {
  0%, 50%   { opacity: 0; }
  54%, 88%  { opacity: 1; }
  92%, 100% { opacity: 0; }
}
@keyframes s-heart {
  0%, 12%   { transform: scale(0); }
  17%       { transform: scale(1.25); }
  21%, 88%  { transform: scale(1); }
  94%, 100% { transform: scale(0); }
}
@keyframes s-chip {
  0%, 29%   { opacity: 0; transform: translateX(-6px); }
  35%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes s-chip-2 {
  0%, 39%   { opacity: 0; transform: translateX(-6px); }
  45%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes s-chip-3 {
  0%, 49%   { opacity: 0; transform: translateX(-6px); }
  55%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes s-slot {
  0%, 60%   { fill: #ececea; transform: scale(1); }
  64%       { fill: #1f1f1f; transform: scale(1.2); }
  68%, 88%  { fill: #1f1f1f; transform: scale(1); }
  94%, 100% { fill: #ececea; transform: scale(1); }
}

]]></style>
<defs>
  <symbol id="i-heart" class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-heart-solid" class="ic" viewBox="0 0 24 24"><path class="solid" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-comment" class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-send" class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-bookmark" class="ic" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-up" class="ic" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="280" height="160" fill="#fafafa"/>

<!-- Content calendar -->
<rect class="fl-soft" x="10" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="20" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-ink" x="30" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="40" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-mid" x="50" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="60" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-ink" x="70" y="52.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="10" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-mid" x="20" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="30" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-ink" x="40" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="50" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="60" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-mid" x="70" y="63.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="10" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="20" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="30" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-ink" x="40" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="50" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-mid" x="60" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-ink" x="70" y="75.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="10" y="86.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="20" y="86.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="30" y="86.5" width="8" height="8" rx="2.5"/><rect class="s-slot" x="40" y="86.5" width="8" height="8" rx="2.5" fill="#ececea"/><rect class="fl-mid" x="50" y="86.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="60" y="86.5" width="8" height="8" rx="2.5"/><rect class="fl-ink" x="70" y="86.5" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="10" y="98.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="20" y="98.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="30" y="98.0" width="8" height="8" rx="2.5"/><rect class="fl-mid" x="40" y="98.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="50" y="98.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="60" y="98.0" width="8" height="8" rx="2.5"/><rect class="fl-soft" x="70" y="98.0" width="8" height="8" rx="2.5"/>
<text class="lbl" x="10" y="126">Calendar</text>

<!-- Post -->
<defs><clipPath id="m-media"><rect x="96" y="38" width="88" height="66" rx="5"/></clipPath></defs>
<rect class="ln ln-ink fl-w" x="88.5" y="12.5" width="103" height="135" rx="10"/>
<defs><clipPath id="m-av"><circle cx="101" cy="26" r="6"/></clipPath></defs>
<circle fill="#e4e4e2" cx="101" cy="26" r="6"/>
<g clip-path="url(#m-av)" fill="#a9a9a7"><circle cx="101" cy="24.2" r="2.4"/><ellipse cx="101" cy="32.2" rx="4.8" ry="4"/></g>
<circle class="ln ln-soft" cx="101" cy="26" r="6.5"/>
<rect class="fl-mid" x="112" y="21.5" width="36" height="3.5" rx="1.75"/>
<rect class="fl-soft" x="112" y="28" width="22" height="2.5" rx="1.25"/>
<g fill="#b4b4b2"><circle cx="174" cy="26" r="1.1"/><circle cx="178" cy="26" r="1.1"/><circle cx="182" cy="26" r="1.1"/></g>

<g clip-path="url(#m-media)">
  <g class="s-track">
    <!-- slide 1 -->
    <rect x="96" y="38" width="88" height="66" fill="#ececea"/>
    <circle cx="119" cy="56" r="6.5" fill="#fff"/>
    <path fill="#dcdcda" d="M96 104V80C108 68 120 69 130 77C138 83 148 83 156 76C166 68 176 70 184 77V104Z"/>
    <path fill="#cbcbc9" d="M96 104V90C110 83 122 86 134 90C148 95 162 88 172 86C177 85 181 86 184 88V104Z"/>
    <!-- slide 2 -->
    <rect x="184" y="38" width="88" height="66" fill="#e8e8e6"/>
    <circle cx="206" cy="58" r="8" fill="#fff"/>
