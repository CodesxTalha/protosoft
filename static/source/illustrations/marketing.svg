    <path fill="#dcdcda" d="M252 104V88a8 8 0 0 1 16 0V104Z"/>
    <path fill="#b9b9b7" d="M186 104V92a6 6 0 0 1 12 0V104Z"/>
  </g>
</g>
<!-- slide counter -->
<rect fill="#1f1f1f" opacity=".78" x="159" y="43" width="19" height="9.5" rx="4.75"/>
<text class="s-n1" x="168.5" y="49.9" text-anchor="middle" font-size="5.6" font-weight="500" fill="#fafafa">1/2</text>
<text class="s-n2" x="168.5" y="49.9" text-anchor="middle" font-size="5.6" font-weight="500" fill="#fafafa">2/2</text>

<!-- Actions -->
<use href="#i-heart" x="96" y="112" width="12" height="12" color="#141414"/>
<g class="s-heart"><use href="#i-heart-solid" x="96" y="112" width="12" height="12" color="#141414"/></g>
