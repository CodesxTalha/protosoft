<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="automation">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ln-ink  { stroke: #141414; }
.ln-mid  { stroke: #b4b4b2; }
.ln-soft { stroke: #dcdcda; }
.fl-w    { fill: #fff; }
.fl-soft { fill: #ececea; }
.fl-mid  { fill: #d6d6d4; }
.fl-ink  { fill: #1f1f1f; }
.lbl { font-size: 7px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.txt { font-size: 8.5px; font-weight: 500; fill: #141414; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.b-unread { fill: #d6d6d4; animation: b-unread 6s ease infinite; }
.b-in     { animation: b-in 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-typing { opacity: 0; animation: b-typing 6s ease infinite; }
.b-dot    { animation: b-dot 1s ease-in-out infinite; }
.b-dot-2  { animation-delay: .15s; }
.b-dot-3  { animation-delay: .3s; }
.b-reply  { animation: b-reply 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-thanks { animation: b-thanks 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-chip   { animation: b-chip 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-chip-2 { animation-name: b-chip-2; }
.b-chip-3 { animation-name: b-chip-3; }
@keyframes b-unread {
  0%, 6%    { fill: #1f1f1f; }
  10%, 88%  { fill: #d6d6d4; }
  94%, 100% { fill: #1f1f1f; }
}
@keyframes b-in {
  0%, 3%    { opacity: 0; transform: translateY(6px); }
  9%, 88%   { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-typing {
  0%, 12%   { opacity: 0; }
  15%, 30%  { opacity: 1; }
  32%, 100% { opacity: 0; }
}
@keyframes b-dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes b-reply {
  0%, 31%   { opacity: 0; transform: translateY(6px); }
  36%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-thanks {
  0%, 70%   { opacity: 0; transform: translateY(6px); }
  75%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-chip {
  0%, 38%   { opacity: 0; transform: translateX(-6px); }
  44%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-chip-2 {
  0%, 48%   { opacity: 0; transform: translateX(-6px); }
  54%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-chip-3 {
  0%, 58%   { opacity: 0; transform: translateX(-6px); }
  64%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}

]]></style>
<defs>
  <symbol id="i-heart" class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-heart-solid" class="ic" viewBox="0 0 24 24"><path class="solid" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-comment" class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-send" class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-bookmark" class="ic" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-up" class="ic" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="280" height="160" fill="#fafafa"/>

<rect class="ln ln-soft fl-w" x="18.5" y="51.5" width="58" height="16" rx="5"/><circle class="fl-mid" cx="27.5" cy="59.5" r="3.5"/><rect class="fl-mid" x="35" y="58.25" width="26" height="2.5" rx="1.25"/><circle class="b-unread" cx="69" cy="59.5" r="2"/><rect class="ln ln-soft fl-w" x="18.5" y="71.5" width="58" height="16" rx="5"/><circle class="fl-mid" cx="27.5" cy="79.5" r="3.5"/><rect class="fl-mid" x="35" y="78.25" width="20" height="2.5" rx="1.25"/><circle class="fl-ink" cx="69" cy="79.5" r="2"/><rect class="ln ln-soft fl-w" x="18.5" y="91.5" width="58" height="16" rx="5"/><circle class="fl-mid" cx="27.5" cy="99.5" r="3.5"/><rect class="fl-mid" x="35" y="98.25" width="24" height="2.5" rx="1.25"/><circle class="fl-mid" cx="69" cy="99.5" r="2"/>
<text class="lbl" x="18" y="126">Inbox</text>

<!-- Agent chat -->
<rect class="ln ln-ink fl-w" x="88.5" y="12.5" width="103" height="135" rx="10"/>
<rect class="fl-ink" x="96" y="19" width="11" height="11" rx="3.5"/>
<use href="#plus" x="99" y="22" width="5" height="5" color="#fafafa"/>
<text class="txt" x="112" y="27.3" font-size="8">AI agent</text>
<line class="ln ln-soft" x1="89" y1="36.5" x2="191" y2="36.5"/>

<g class="b-in">
  <rect class="fl-ink" x="122" y="44" width="62" height="20" rx="7"/>
  <rect fill="#fafafa" x="128" y="50" width="46" height="2.5" rx="1.25"/>
  <rect fill="#8f8f8d" x="128" y="56" width="30" height="2.5" rx="1.25"/>
</g>
<g class="b-typing">
  <rect class="fl-soft" x="96" y="70" width="26" height="14" rx="7"/>
  <circle class="b-dot b-dot-1" cx="103" cy="77" r="1.4" fill="#8f8f8d"/>
  <circle class="b-dot b-dot-2" cx="109" cy="77" r="1.4" fill="#8f8f8d"/>
  <circle class="b-dot b-dot-3" cx="115" cy="77" r="1.4" fill="#8f8f8d"/>
</g>
<g class="b-reply">
  <rect class="fl-soft" x="96" y="70" width="62" height="26" rx="7"/>
  <rect class="fl-mid" x="102" y="76" width="46" height="2.5" rx="1.25"/>
  <rect class="fl-mid" x="102" y="82" width="38" height="2.5" rx="1.25"/>
  <rect fill="#e0e0de" x="102" y="88" width="24" height="2.5" rx="1.25"/>
</g>
<g class="b-thanks">
  <rect class="fl-ink" x="146" y="102" width="38" height="14" rx="7"/>
  <rect fill="#fafafa" x="152" y="107.75" width="24" height="2.5" rx="1.25"/>
</g>

<rect class="ln ln-soft fl-w" x="96.5" y="128.5" width="88" height="12" rx="6"/>
<rect class="fl-soft" x="102" y="133.25" width="30" height="2.5" rx="1.25"/>
<circle class="fl-ink" cx="178.5" cy="134.5" r="4.2"/>
<use href="#i-up" x="175.5" y="131.5" width="6" height="6" color="#fafafa" style="--sw:4"/>

<g class="b-chip b-chip-1">
  <rect class="ln ln-soft fl-w" x="208.5" y="51.5" width="54" height="18" rx="9"/>
  <circle class="fl-ink" cx="218.5" cy="60.5" r="4"/>
  <use href="#i-check" x="215.5" y="57.5" width="6" height="6" color="#fafafa" style="--sw:4"/>
  <text class="txt" x="227" y="63.5">Replied</text>
</g>
<g class="b-chip b-chip-2">
  <rect class="ln ln-soft fl-w" x="208.5" y="73.5" width="54" height="18" rx="9"/>
  <circle class="fl-ink" cx="218.5" cy="82.5" r="4"/>
  <use href="#i-check" x="215.5" y="79.5" width="6" height="6" color="#fafafa" style="--sw:4"/>
  <text class="txt" x="227" y="85.5">In CRM</text>
</g>
<g class="b-chip b-chip-3">
  <rect class="ln ln-soft fl-w" x="208.5" y="95.5" width="54" height="18" rx="9"/>
  <circle class="fl-ink" cx="218.5" cy="104.5" r="4"/>
  <use href="#i-check" x="215.5" y="101.5" width="6" height="6" color="#fafafa" style="--sw:4"/>
  <text class="txt" x="227" y="107.5">Booked</text>
</g>
<text class="lbl" x="208" y="126">Done</text>


</svg>
