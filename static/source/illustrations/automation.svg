<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="automation">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap');
svg { font-family: "Inter Tight", system-ui, -apple-system, sans-serif; }
.ln { fill: none; stroke-width: 1; }
.ink { stroke: #141414; }
.soft { stroke: #e0e0de; }
.mid { stroke: #b4b4b2; }
.w { fill: #fff; }
.bg { fill: #fafafa; }
.f1 { fill: #1f1f1f; }
.f2 { fill: #ececea; }
.f3 { fill: #d6d6d4; }
.lbl { font-size: 6.2px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: #8a8a88; }
.t5 { font-size: 5px; font-weight: 500; fill: #141414; }
.t6 { font-size: 6px; font-weight: 600; fill: #141414; }
.mu { fill: #8a8a88; font-weight: 400; }
.inv { fill: #fafafa; }
symbol.ic * { fill: none; stroke: currentColor; stroke-width: var(--sw, 2); stroke-linecap: round; stroke-linejoin: round; }
symbol.ic .solid { fill: currentColor; }


.b-unread { fill: #1f1f1f; animation: b-unread 6s ease infinite; }
.b-in     { animation: b-in 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-typing { opacity: 0; animation: b-typing 6s ease infinite; }
.b-dot    { animation: b-dot 1s ease-in-out infinite; }
.b-dot-2  { animation-delay: .15s; }
.b-dot-3  { animation-delay: .3s; }
.b-reply  { animation: b-reply 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-thanks { animation: b-thanks 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-chip   { animation: b-chip 6s cubic-bezier(.3, 0, .2, 1) infinite; }
.b-chip-2 { animation-name: b-chip-2; }
.b-chip-3 { animation-name: b-chip-3; }
@keyframes b-unread {
  0%, 6%    { fill: #1f1f1f; }
  10%, 88%  { fill: #d2d2d0; }
  94%, 100% { fill: #1f1f1f; }
}
@keyframes b-in {
  0%, 3%    { opacity: 0; transform: translateY(6px); }
  9%, 88%   { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-typing {
  0%, 12%   { opacity: 0; }
  15%, 30%  { opacity: 1; }
  32%, 100% { opacity: 0; }
}
@keyframes b-dot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes b-reply {
  0%, 31%   { opacity: 0; transform: translateY(6px); }
  36%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-thanks {
  0%, 70%   { opacity: 0; transform: translateY(6px); }
  75%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-chip {
  0%, 38%   { opacity: 0; transform: translateX(-6px); }
  44%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-chip-2 {
  0%, 48%   { opacity: 0; transform: translateX(-6px); }
  54%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}
@keyframes b-chip-3 {
  0%, 58%   { opacity: 0; transform: translateX(-6px); }
  64%, 88%  { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; transform: none; }
}

]]></style>
<defs>
  <symbol id="i-heart" class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-heart-solid" class="ic" viewBox="0 0 24 24"><path class="solid" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-comment" class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
  <symbol id="i-send" class="ic" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-bookmark" class="ic" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-up" class="ic" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 2.5v19M2.5 12h19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
</defs>
<rect width="280" height="160" class="bg"/>

<rect class="ln soft w" x="12.5" y="30.5" width="66" height="22" rx="5"/>
    <circle fill="#e4e4e2" cx="23" cy="41.5" r="5.2"/>
    <text x="23" y="43.2" text-anchor="middle" font-size="5" font-weight="600" fill="#141414">M</text>
    <text class="t5" x="31.5" y="40.1" style="font-size:5.2px;font-weight:600">Maya R.</text>
    <text class="t5 mu" x="31.5" y="47.1" style="font-size:4.3px">Can we book a demo?</text>
    <circle class="b-unread" cx="72.5" cy="37.5" r="2"/><rect class="ln soft w" x="12.5" y="56.5" width="66" height="22" rx="5"/>
    <circle fill="#e4e4e2" cx="23" cy="67.5" r="5.2"/>
    <text x="23" y="69.2" text-anchor="middle" font-size="5" font-weight="600" fill="#141414">O</text>
    <text class="t5" x="31.5" y="66.1" style="font-size:5.2px;font-weight:600">Omar K.</text>
    <text class="t5 mu" x="31.5" y="73.1" style="font-size:4.3px">Pricing for 3 sites</text>
    <circle class="f1" cx="72.5" cy="63.5" r="2"/><rect class="ln soft w" x="12.5" y="82.5" width="66" height="22" rx="5"/>
    <circle fill="#e4e4e2" cx="23" cy="93.5" r="5.2"/>
    <text x="23" y="95.2" text-anchor="middle" font-size="5" font-weight="600" fill="#141414">Z</text>
    <text class="t5" x="31.5" y="92.1" style="font-size:5.2px;font-weight:600">Zoya A.</text>
    <text class="t5 mu" x="31.5" y="99.1" style="font-size:4.3px">Thanks, all received</text>
    
<text class="lbl" x="12.5" y="124">Inbox</text>

<!-- Chat -->
<rect class="ln ink w" x="88.5" y="12.5" width="103" height="135" rx="10"/>
<circle class="f1" cx="101" cy="26" r="6"/>
<use href="#plus" x="98" y="23" width="6" height="6" color="#fafafa"/>
<text class="t6" x="111" y="25" style="font-size:6.4px">Assistant</text>
<circle class="f1" cx="112.2" cy="30.4" r="1.2"/>
<text class="t5 mu" x="115.6" y="32" style="font-size:4.5px">Online</text>
<line class="ln soft" x1="89" y1="38.5" x2="191" y2="38.5"/>

<g class="b-in">
  <rect class="f1" x="108" y="45" width="76" height="17" rx="7"/>
  <text x="114" y="55.6" font-size="5.2" font-weight="500" class="inv">Do you have time Thursday?</text>
</g>
<g class="b-typing">
  <rect class="f2" x="96" y="69" width="26" height="14" rx="7"/>
  <circle class="b-dot b-dot-1" cx="103.5" cy="76" r="1.4" fill="#8f8f8d"/>
  <circle class="b-dot b-dot-2" cx="109" cy="76" r="1.4" fill="#8f8f8d"/>
  <circle class="b-dot b-dot-3" cx="114.5" cy="76" r="1.4" fill="#8f8f8d"/>
</g>
<g class="b-reply">
  <rect class="f2" x="96" y="69" width="74" height="27" rx="7"/>
  <text x="102" y="79.6" font-size="5.2" font-weight="500" fill="#141414">Yes! Thursday at 3 PM</text>
  <text x="102" y="87.8" font-size="5.2" font-weight="500" fill="#141414">works. Invite sent.</text>
</g>
<g class="b-thanks">
  <rect class="f1" x="132" y="102" width="52" height="16" rx="7"/>
  <text x="138" y="112" font-size="5.2" font-weight="500" class="inv">Perfect, thanks!</text>
</g>

<rect class="ln soft w" x="96.5" y="128.5" width="88" height="13" rx="6.5"/>
<text class="t5 mu" x="103" y="136.8" style="font-size:5px;fill:#b0b0ae">Message…</text>
<circle class="f1" cx="177.5" cy="135" r="4.6"/>
<use href="#i-up" x="174.5" y="132" width="6" height="6" color="#fafafa" style="--sw:4"/>

<g class="b-chip b-chip-1">
  <rect class="ln soft w" x="204.5" y="30.5" width="65" height="20" rx="10"/>
  <circle class="f1" cx="215" cy="40.5" r="4.6"/>
  <use href="#i-check" x="212" y="37.5" width="6" height="6" color="#fafafa" style="--sw:4"/>
  <text class="t5" x="223.5" y="43.1" style="font-size:5.6px">Replied</text>
</g>
<g class="b-chip b-chip-2">
  <rect class="ln soft w" x="204.5" y="56.5" width="65" height="20" rx="10"/>
  <circle class="f1" cx="215" cy="66.5" r="4.6"/>
  <use href="#i-check" x="212" y="63.5" width="6" height="6" color="#fafafa" style="--sw:4"/>
  <text class="t5" x="223.5" y="69.1" style="font-size:5.6px">In CRM</text>
</g>
<g class="b-chip b-chip-3">
  <rect class="ln soft w" x="204.5" y="82.5" width="65" height="20" rx="10"/>
  <circle class="f1" cx="215" cy="92.5" r="4.6"/>
  <use href="#i-check" x="212" y="89.5" width="6" height="6" color="#fafafa" style="--sw:4"/>
  <text class="t5" x="223.5" y="95.1" style="font-size:5.6px">Booked · Thu</text>
</g>
<text class="lbl" x="204.5" y="124">Done</text>


</svg>
